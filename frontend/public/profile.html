<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARCO-XMD | Profil</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#101d31;--line:#243754;--text:#f8fafc;--muted:#9fb0c8;--primary:#3b82f6;--success:#34d399;--danger:#f87171}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#0d2340,var(--bg) 45%);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(100% - 32px,900px);margin:auto;padding:28px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;border-radius:12px}.brand strong{display:block}.brand small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}a,.btn{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--card);color:var(--text);text-decoration:none;font:inherit;cursor:pointer}.primary{background:var(--primary);border-color:var(--primary)}.danger{color:#fecaca}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(16,29,49,.94);border:1px solid var(--line);border-radius:18px;padding:24px}.card h1{margin:0 0 8px;font-size:1.35rem}.card h2{font-size:1rem;margin:0 0 18px}.muted{color:var(--muted);font-size:.9rem}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:.82rem}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#091528;color:var(--text);font:inherit}textarea{min-height:120px;resize:vertical}.notice{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:.88rem}.notice.show{display:block}.ok{background:#103b32;color:#a7f3d0}.err{background:#451b26;color:#fecaca}@media(max-width:680px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand"><img src="/media/logo512.png" alt="MARCO-XMD"><div><strong>MARCO-XMD</strong><small>Mon espace personnel</small></div></div><nav class="actions"><a href="/index.html">Dashboard</a><a href="/history.html">Historique</a><button class="btn danger" id="logout">Déconnexion</button></nav></header>
<section class="grid"><article class="card"><h1>Mon profil</h1><p class="muted" id="email">Chargement…</p><form id="profileForm"><div class="field"><label for="displayName">Nom affiché</label><input id="displayName" maxlength="80"></div><div class="field"><label for="avatarUrl">URL de photo (optionnel)</label><input id="avatarUrl" type="url" maxlength="500"></div><div class="field"><label for="bio">Bio</label><textarea id="bio" maxlength="500"></textarea></div><button class="btn primary" type="submit">Enregistrer mon profil</button></form><div id="notice" class="notice"></div></article>
<article class="card"><h2>Ton compte</h2><p class="muted">Ton compte est protégé. Tes données de profil et ton historique sont accessibles uniquement par toi.</p><p class="muted">Pour consulter tes dernières activités :</p><a class="btn primary" href="/history.html">Voir mon historique</a></article></section></main>
<script src="/vendor/supabase/supabase.js?v=20261005></script><script src="/account.js?v=20261005"></script><script>
(async()=>{const user=await MarcoAccount.requireUser();if(!user)return;document.getElementById('email').textContent=user.email||'';const client=await MarcoAccount.getClient();let {data:profile}=await client.from('profiles').select('display_name,avatar_url,bio').eq('id',user.id).maybeSingle();profile=profile||{};displayName.value=profile.display_name||user.user_metadata?.display_name||'';avatarUrl.value=profile.avatar_url||'';bio.value=profile.bio||'';document.getElementById('logout').onclick=MarcoAccount.signOut;profileForm.onsubmit=async e=>{e.preventDefault();const notice=document.getElementById('notice');const {error}=await client.from('profiles').upsert({id:user.id,display_name:displayName.value.trim(),avatar_url:avatarUrl.value.trim()||null,bio:bio.value.trim()},{onConflict:'id'});if(error){notice.textContent='Impossible d’enregistrer les modifications. Réessayez plus tard.';notice.className='notice show err';return}await MarcoAccount.addHistory(user.id,'profile_update','Profil mis à jour','Les informations de profil ont été enregistrées.');notice.textContent='Profil enregistré.';notice.className='notice show ok';};})();
</script><script src="/pwa-update.js?v=20261004v5"></script>
</body></html>
