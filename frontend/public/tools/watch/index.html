<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="MARCO Watch — Films, documentaires, live et vidéos gratuits">
<title>MARCO Watch — Films & Vidéos | MARCO-XMD</title>

<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://www.youtube.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" type="image/png" href="/media/logo512.png">
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=1">

<script>
(function(){
  try {
    var s = localStorage.getItem('marco-theme');
    var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', s || (d ? 'dark' : 'light'));
  } catch(e){}
})();
</script>
</head>
<body>

<nav class="watch-navbar" aria-label="Navigation principale">
  <div class="navbar-inner">
    <div class="brand-mini">
      <img src="/media/logo512.png" alt="Logo MARCO-XMD" width="36" height="36">
      <div class="brand-mini-info">
        <h1>MARCO Watch</h1>
        <span>Films · Vidéos · Live</span>
      </div>
    </div>
    <button class="nav-icon-btn" id="btnFocusSearch" aria-label="Rechercher">
      <i class="fas fa-search" aria-hidden="true"></i>
    </button>
    <button class="nav-icon-btn" id="btnMyList" aria-label="Ma liste" aria-pressed="false">
      <i class="fas fa-bookmark" aria-hidden="true"></i>
    </button>
    <a class="nav-icon-btn" id="btnBackHome" href="/index.html" aria-label="Retour a l accueil" title="Retour">
  <i class="fas fa-arrow-left" aria-hidden="true"></i>
</a>
    <button class="nav-icon-btn" id="btnTheme" aria-label="Changer le thème">
      <i class="fas fa-sun" aria-hidden="true"></i>
    </button>
    <a class="nav-icon-btn" href="/index.html" aria-label="Retour à l'accueil" title="Retour">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
    </a>
  </div>
</nav>

<section class="feature-banner" id="featureBanner" style="--hero-img:url('https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg')">
  <div class="feature-content">
    <span class="feature-tag"><i class="fas fa-fire" aria-hidden="true"></i> À la une</span>
    <h2 class="feature-title" id="featureTitle">Rick Astley — Never Gonna Give You Up</h2>
    <div class="feature-meta">
      <span><i class="far fa-clock" aria-hidden="true"></i> 3:33</span>
      <span><i class="far fa-eye" aria-hidden="true"></i> 1.8B vues</span>
      <span><i class="fas fa-fire" aria-hidden="true"></i> Top #1</span>
    </div>
    <div class="feature-actions">
      <button class="btn-play-main" id="btnFeaturePlay" data-video-id="dQw4w9WgXcQ" data-video-title="Rick Astley — Never Gonna Give You Up" data-video-channel="Rick Astley">
        <i class="fas fa-play" aria-hidden="true"></i> Lecture
      </button>
      <button class="btn-icon-main" data-action="download" data-video-id="dQw4w9WgXcQ" aria-label="Télécharger">
        <i class="fas fa-download" aria-hidden="true"></i>
      </button>
      <button class="btn-icon-main" data-action="toggle-list" data-video-id="dQw4w9WgXcQ" data-video-title="Rick Astley — Never Gonna Give You Up" data-video-channel="Rick Astley" aria-pressed="false" aria-label="Ajouter à ma liste">
        <i class="fas fa-plus" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</section>

<div class="search-bar" role="search">
  <label for="searchInput" class="sr-only">Rechercher une vidéo</label>
  <input type="search" id="searchInput" placeholder="Rechercher un film, une vidéo, une chaîne..." autocomplete="off">
  <button id="btnSearch" aria-label="Rechercher">
    <i class="fas fa-search" aria-hidden="true"></i>
  </button>
</div>

<div class="categories-scroll" role="tablist" aria-label="Catégories" id="categoriesScroll">
  <button class="cat-chip" role="tab" aria-selected="true" aria-pressed="true" data-category="all">
    <i class="fas fa-fire" aria-hidden="true"></i> Tendance
  </button>
  <button class="cat-chip" role="tab" aria-selected="false" aria-pressed="false" data-category="films">
    <i class="fas fa-film" aria-hidden="true"></i> Films
  </button>
  <button class="cat-chip" role="tab" aria-selected="false" aria-pressed="false" data-category="live">
    <i class="fas fa-circle-play" aria-hidden="true"></i> Live
  </button>
  <button class="cat-chip" role="tab" aria-selected="false" aria-pressed="false" data-category="documentaires">
    <i class="fas fa-newspaper" aria-hidden="true"></i> Documentaires
  </button>
  <button class="cat-chip" role="tab" aria-selected="false" aria-pressed="false" data-category="musique">
    <i class="fas fa-music" aria-hidden="true"></i> Musique
  </button>
</div>

<main id="mainContent">
  <div class="loading-state">
    <div class="spinner"></div>
    <p>Chargement des vidéos...</p>
  </div>
</main>

<div class="player-modal" id="playerModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="playerTitle">
  <div class="player-box" id="playerBox">
    <div class="player-video">
      <video id="playerVideo"
              controls
              autoplay
              playsinline
              preload="metadata"
              style="width:100%;height:100%;background:#000;display:block;"></video>

      <div class="player-overlay-controls">
        <button class="overlay-btn" id="btnRotate" aria-label="Rotation paysage" aria-pressed="false" title="Rotation paysage">
          <i class="fas fa-rotate" id="rotateIcon" aria-hidden="true"></i>
        </button>
        <button class="overlay-btn" id="btnFullscreen" aria-label="Plein écran" aria-pressed="false" title="Plein écran">
          <i class="fas fa-expand" id="fsIcon" aria-hidden="true"></i>
        </button>
      </div>

      <div class="rotate-hint" id="rotateHint" role="status" aria-live="polite">
        <i class="fas fa-mobile-screen" aria-hidden="true"></i> Tournez votre téléphone
      </div>
    </div>

    <div class="player-header">
      <div class="player-info">
        <div class="player-title" id="playerTitle">—</div>
        <div class="player-channel" id="playerChannel">—</div>
      </div>
      <button class="player-close" id="btnClosePlayer" aria-label="Fermer le lecteur">
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <div class="player-actions">
      <button class="player-action-btn primary" id="btnDownload">
        <i class="fas fa-download" aria-hidden="true"></i> Télécharger
      </button>
      <button class="player-action-btn" id="btnAddToList" aria-pressed="false">
        <i class="fas fa-plus" aria-hidden="true"></i> Ma liste
      </button>
      <button class="player-action-btn" id="btnShare">
        <i class="fas fa-share-nodes" aria-hidden="true"></i> Partager
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<script src="./app.js?v=1"></script>
</body>
</html>
