<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e1a">
  <title>MARCO-XMD | Bienvenue</title>
  <link rel="icon" type="image/png" href="/media/logo512.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root{--bg:#0a0e1a;--surface:#111827;--surface-alt:#1e293b;--text:#f1f5f9;--text-soft:#cbd5e1;--muted:#64748b;--border:#1e293b;--border-hover:#334155;--primary:#3b82f6;--primary-dark:#1d4ed8;--glow:rgba(59,130,246,.4);--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--radius-lg:16px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#17345b 0,transparent 45%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;padding:24px 16px}.shell{width:min(100%,460px)}.brand{text-align:center;margin-bottom:22px}.brand img{width:88px;height:88px;border-radius:20px;box-shadow:0 8px 32px var(--glow);margin:0 auto 18px;display:block}.brand h1{font-size:1.8rem;font-weight:800;letter-spacing:-.5px;margin:0 0 6px}.brand p{margin:0;color:var(--muted);font-size:.95rem}.card{background:rgba(17,24,39,.96);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:0 24px 80px #0008}.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-alt);border-radius:10px;margin-bottom:20px}.tabs button{flex:1;border:0;border-radius:8px;padding:11px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}.tabs button.active{background:var(--primary);color:#fff}.field{margin:14px 0}.field label{display:block;color:var(--text-soft);font-size:.82rem;font-weight:600;margin-bottom:7px}.input-wrap{position:relative}.input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}input{width:100%;height:48px;padding:0 14px 0 42px;border:1px solid var(--border-hover);border-radius:10px;background:#0b1324;color:var(--text);font:inherit;outline:0}input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--glow)}.btn{width:100%;min-height:48px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.6;cursor:wait}.message{display:none;margin:14px 0;padding:11px;border-radius:9px;font-size:.85rem;line-height:1.45}.message.show{display:block}.message.error{background:#451b26;color:#fecaca}.message.success{background:#103b32;color:#a7f3d0}.separator{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;margin:20px 0}.separator:before,.separator:after{content:"";height:1px;background:var(--border);flex:1}.google{width:100%;min-height:46px;border:1px solid var(--border-hover);border-radius:10px;background:#fff;color:#111827;font:inherit;font-weight:700;cursor:pointer;margin-bottom:10px}.guest{display:block;width:100%;border:2px dashed var(--border-hover);border-radius:10px;background:transparent;color:var(--text-soft);padding:12px;cursor:pointer;text-align:left;font:inherit}.guest strong{display:block;color:var(--text);font-size:.92rem}.guest i{color:var(--warning);margin-right:8px}.guest small{display:block;color:var(--muted);margin:5px 0 0 26px;line-height:1.35}.benefits{margin-top:18px;padding:14px;background:var(--surface-alt);border-radius:10px;color:var(--text-soft);font-size:.82rem}.benefits h2{font-size:.9rem;margin:0 0 10px}.benefits-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.benefits span{display:block}.ok{color:var(--success)}.no{color:var(--danger)}.footer{text-align:center;margin-top:16px;color:var(--muted);font-size:.75rem}.footer a{color:#93c5fd;text-decoration:none}.lang{display:flex;justify-content:center;gap:6px;margin-top:14px}.lang button{border:1px solid var(--border);background:var(--surface);color:var(--text-soft);border-radius:8px;padding:6px 9px;cursor:pointer}@media(max-width:420px){body{padding:16px 12px}.card{padding:18px}.benefits-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand"><img src="/media/logo512.png" alt="MARCO-XMD"><h1 data-i18n="auth.title">Bienvenue</h1><p data-i18n="auth.subtitle">Application web évolutive</p></header>
    <section class="card" aria-label="Authentification">
      <div class="tabs"><button id="loginTab" class="active" type="button"><i class="fa-solid fa-user"></i> <span data-i18n="auth.tab.login">Se connecter</span></button><button id="signupTab" type="button"><i class="fa-solid fa-user-plus"></i> <span data-i18n="auth.tab.signup">Créer un compte</span></button></div>
      <form id="authForm">
        <div class="field" id="nameField" hidden><label for="name" data-i18n="auth.field.name">Nom affiché</label><div class="input-wrap"><i class="fa-solid fa-id-card"></i><input id="name" maxlength="80" autocomplete="name"></div></div>
        <div class="field"><label for="email" data-i18n="auth.field.email">Adresse e-mail</label><div class="input-wrap"><i class="fa-solid fa-envelope"></i><input id="email" type="email" required autocomplete="email" placeholder="vous@exemple.com"></div></div>
        <div class="field"><label for="password" data-i18n="auth.field.password">Mot de passe</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="password" type="password" required minlength="6" autocomplete="current-password"></div></div>
        <div id="message" class="message" role="status"></div>
        <button id="submit" class="btn" type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> <span data-i18n="auth.btn.login">Se connecter</span></button>
      </form>
      <div class="separator"><span data-i18n="auth.or">ou</span></div>
      <button class="google" id="googleBtn" type="button"><i class="fa-brands fa-google"></i> <span data-i18n="auth.oauth.google">Continuer avec Google</span></button>
      <button class="guest" id="guestBtn" type="button"><strong><i class="fa-solid fa-user-secret"></i><span data-i18n="auth.guest.title">Continuer sans compte</span></strong><small data-i18n="auth.guest.subtitle">Accès aux outils uniquement. Aucune donnée sauvegardée.</small></button>
      <div class="benefits"><h2><i class="fa-solid fa-circle-info"></i> <span data-i18n="auth.guest.benefits.title">Mode invité</span></h2><div class="benefits-grid"><span class="ok"><i class="fa-solid fa-circle-check"></i> Video Downloader</span><span class="ok"><i class="fa-solid fa-circle-check"></i> Voice Studio</span><span class="ok"><i class="fa-solid fa-circle-check"></i> Marco Lyrics</span><span class="ok"><i class="fa-solid fa-circle-check"></i> Mini-jeux</span><span class="no"><i class="fa-solid fa-xmark"></i> <span data-i18n="auth.guest.limits.history">Pas d'historique</span></span><span class="no"><i class="fa-solid fa-xmark"></i> <span data-i18n="auth.guest.limits.sync">Pas de synchronisation</span></span></div></div>
    </section>
    <footer class="footer"><span data-i18n="auth.terms">En continuant, vous acceptez les</span> <a href="/#terms" data-i18n="auth.terms.link">Conditions d'utilisation</a><div class="lang"><button type="button" onclick="marcoI18n.setLang('fr')">🇫🇷</button><button type="button" onclick="marcoI18n.setLang('ht')">🇭🇹</button><button type="button" onclick="marcoI18n.setLang('en')">🇺🇸</button></div></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/account.js?v=refactor1"></script><script src="/translations.js?v=refactor1"></script><script src="/i18n.js?v=refactor1"></script>
  <script>
    (() => { let mode='login'; const $=id=>document.getElementById(id), form=$('authForm'), nameField=$('nameField'), submit=$('submit'), message=$('message'); const show=(text,type)=>{message.textContent=text;message.className='message show '+type}; const setMode=next=>{mode=next;$('loginTab').classList.toggle('active',mode==='login');$('signupTab').classList.toggle('active',mode==='signup');nameField.hidden=mode!=='signup';submit.innerHTML=`<i class="fa-solid ${mode==='signup'?'fa-user-plus':'fa-arrow-right-to-bracket'}"></i> <span>${mode==='signup'?'Créer un compte':'Se connecter'}</span>`;message.className='message'}; $('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('guestBtn').onclick=()=>{localStorage.setItem('marco-guest','true');location.href='/index.html'}; $('googleBtn').onclick=async()=>{try{const client=await MarcoAccount.getClient();const result=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/index.html'}});if(result.error)throw result.error}catch(error){show(error.message||'Connexion Google indisponible.','error')}}; (async()=>{if(await MarcoAccount.currentUser())location.href='/index.html'})(); form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;show('Connexion à Supabase…','success');try{const client=await MarcoAccount.getClient(),email=$('email').value.trim(),password=$('password').value;let result;if(mode==='signup')result=await client.auth.signUp({email,password,options:{data:{display_name:$('name').value.trim()}}});else result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;localStorage.removeItem('marco-guest');if(result.data.user)await MarcoAccount.addHistory(result.data.user.id,mode==='signup'?'signup':'login',mode==='signup'?'Compte créé':'Connexion','Accès à MARCO-XMD');if(mode==='signup'&&!result.data.session){show('Compte créé. Vérifie ton e-mail pour confirmer ton adresse.','success');submit.disabled=false;return}location.href='/index.html'}catch(error){show(error.message||'Une erreur est survenue.','error');submit.disabled=false}}; })();
  </script>
</body>
</html>
