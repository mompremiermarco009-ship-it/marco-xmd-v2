services:
  - type: web
    name: marco-xmd
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: bash build.sh
    startCommand: node backend/index.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VOICE_PORT
        value: 5001
      - key: ADMIN_CODE
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@marco-xmd.com
      - key: SUPABASE_URL
        value: https://btavjbuzreapisdnmetv.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
