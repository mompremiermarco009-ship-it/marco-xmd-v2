<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statut | MARCO-XMD</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/mrD86FZ3/Marcoxmd-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function() {
            const saved = localStorage.getItem('marco-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
    <style>
        :root {
            --primary: #0d6efd;
            --primary-light: #3b82f6;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-soft: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 10px 40px rgba(13,110,253,0.10);
        }
        [data-theme="dark"] {
            --primary: #3b82f6;
            --bg: #0a0e1a;
            --surface: #111827;
            --text: #f1f5f9;
            --text-soft: #cbd5e1;
            --text-muted: #64748b;
            --border: #1e293b;
            --shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            max-width: 560px;
            width: 100%;
            box-shadow: var(--shadow);
            animation: cardIn 0.4s ease-out;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .header img {
            width: 54px;
            height: 54px;
            border-radius: 12px;
            border: 2px solid var(--border);
        }
        .header-info h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }
        .header-info span {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .status-row:last-child { border-bottom: none; }
        .status-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-soft);
            font-size: 0.92rem;
            font-weight: 500;
        }
        .status-label i {
            width: 18px;
            color: var(--primary);
            font-size: 0.9rem;
        }
        .status-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }
        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 8px;
            box-shadow: 0 0 0 0 rgba(16,185,129,0.7);
            animation: pulseGreen 2s infinite;
        }
        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }
        .actions {
            margin-top: 24px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.86rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: #0a4db3;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: var(--surface);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .loading {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-note {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.76rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://i.postimg.cc/mrD86FZ3/Marcoxmd-logo.png" alt="MARCO-XMD">
            <div class="header-info">
                <h1>MARCO-XMD</h1>
                <span>/status</span>
            </div>
        </div>

        <div id="content">
            <div class="loading">
                <span class="spinner"></span> Chargement du statut...
            </div>
        </div>

        <div class="actions">
            <a class="btn btn-primary" href="/">
                <i class="fas fa-home"></i> Accueil
            </a>
            <button class="btn btn-outline" onclick="loadStatus()">
                <i class="fas fa-sync-alt"></i> Actualiser
            </button>
        </div>

        <div class="footer-note">
            © 2026 <strong>MARCO-XMD</strong> · by Marco Project
        </div>
    </div>

    <script>
        async function loadStatus() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading"><span class="spinner"></span> Chargement...</div>';
            try {
                const res = await fetch('/status');
                const data = await res.json();
                content.innerHTML = `
                    <div class="status-row">
                        <div class="status-label"><i class="fas fa-robot"></i> Bot</div>
                        <div class="status-value">${data.botName || 'MARCO-XMD'}</div>
                    </div>
                    <div class="status-row">
                        <div class="status-label"><i class="fas fa-circle"></i> Statut</div>
                        <div class="status-value"><span class="pulse-dot"></span>En ligne</div>
                    </div>
                    <div class="status-row">
                        <div class="status-label"><i class="fas fa-layer-group"></i> Sessions actives</div>
                        <div class="status-value">${data.activeSessionsCount || 0}</div>
                    </div>
                    <div class="status-row">
                        <div class="status-label"><i class="fas fa-list"></i> Détail</div>
                        <div class="status-value">${(data.sessions || []).join(', ') || 'Aucune'}</div>
                    </div>
                `;
            } catch (err) {
                content.innerHTML = `<div class="loading" style="color:var(--danger);">❌ Erreur de chargement</div>`;
            }
        }
        loadStatus();
        setInterval(loadStatus, 10000);
    </script>
</body>
</html>
