<!doctype html>
<html lang="fr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARCO-XMD | Historique</title><style>
:root{color-scheme:dark;--bg:#07111f;--card:#101d31;--line:#243754;--text:#f8fafc;--muted:#9fb0c8;--primary:#3b82f6;--danger:#f87171}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#0d2340,var(--bg) 45%);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(100% - 32px,900px);margin:auto;padding:28px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;border-radius:12px}.brand small{display:block;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}a,button{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--card);color:var(--text);text-decoration:none;font:inherit;cursor:pointer}.primary{background:var(--primary);border-color:var(--primary)}.card{background:rgba(16,29,49,.94);border:1px solid var(--line);border-radius:18px;padding:24px}.card h1{margin:0 0 8px;font-size:1.4rem}.muted{color:var(--muted);font-size:.9rem}.item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.icon{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#1c3860;color:#93c5fd;flex:0 0 auto}.item h2{font-size:.95rem;margin:0 0 4px}.item p{margin:0;color:var(--muted);font-size:.86rem}.time{margin-left:auto;color:var(--muted);font-size:.76rem;white-space:nowrap}.empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:680px){.top{align-items:flex-start;flex-direction:column}.time{margin-left:0}.item{flex-wrap:wrap}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="https://i.postimg.cc/mrD86FZ3/Marcoxmd-logo.png" alt="MARCO-XMD"><div><strong>MARCO-XMD</strong><small>Historique personnel</small></div></div><nav class="actions"><a href="/">Accueil</a><a class="primary" href="/profile.html">Mon profil</a><button id="logout">Déconnexion</button></nav></header><section class="card"><h1>Mon historique</h1><p class="muted">Les dernières activités de ton compte.</p><div id="list"><div class="empty">Chargement…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/account.js"></script><script>
(async()=>{const user=await MarcoAccount.requireUser();if(!user)return;document.getElementById('logout').onclick=MarcoAccount.signOut;const client=await MarcoAccount.getClient();const {data,error}=await client.from('activity_history').select('event_type,title,details,created_at').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100);const list=document.getElementById('list');if(error){list.innerHTML='<div class="empty">Impossible de charger l’historique.</div>';return}if(!data?.length){list.innerHTML='<div class="empty">Aucune activité enregistrée pour le moment.</div>';return}list.innerHTML=data.map(item=>{const time=new Date(item.created_at).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'});return `<article class="item"><div class="icon">⌁</div><div><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.details||'')}</p></div><time class="time">${escapeHtml(time)}</time></article>`}).join('');function escapeHtml(value){const el=document.createElement('span');el.textContent=value??'';return el.innerHTML;}})();
</script></body></html>
